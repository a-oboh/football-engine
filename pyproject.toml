[project]
name = "football-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "a-oboh", email = "albertoboh7@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pandas>=3.0.5",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
football-analytics = "football_analytics:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
